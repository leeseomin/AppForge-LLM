name: bugfix
version: '1.0'
category: existing-repository
description: Reproduce, diagnose, fix, and regression-test a defect before release-ready handoff.
match:
  keywords:
  - bug
  - fix
  - crash
  - error
  - regression
  - 버그
  - 오류
  - 고쳐
  - 회귀
orchestration:
  default_mode: autonomous
  max_stage_attempts: 3
stages:
- name: intake
  description: Turn the raw request into a bounded product brief without blocking on routine ambiguity.
  skill: stages/intake.md
  produces:
  - product_brief
  tools:
  - workspace_tree
  checkpoint: true
  approval: false
  review_focus:
  - Problem and users are explicit
  - Constraints and assumptions are separated
  - Non-goals prevent accidental scope growth
  success_criteria:
  - The brief is actionable
  - Open questions have safe defaults or are true blockers
  gates: []
- name: reproduce
  description: Reproduce the reported defect with the smallest failing case before editing code.
  skill: stages/reproduce.md
  produces:
  - reproduction_report
  tools:
  - detect_stack
  - run_tests
  - search_text
  checkpoint: true
  approval: false
  review_focus:
  - Expected and actual behavior are distinct
  - Evidence is repeatable
  - Environment and baseline are recorded
  success_criteria:
  - The failure is reproduced or the limitation is proven
  - A regression test shape is identified
  gates: []
- name: diagnosis
  description: Establish the causal chain and choose the least risky fix.
  skill: stages/diagnosis.md
  produces:
  - diagnosis_report
  tools:
  - search_text
  - read_text
  - git_diff
  checkpoint: true
  approval: false
  review_focus:
  - Root cause is evidence-based
  - Candidate fixes include risks
  - Adjacent code paths are inspected
  success_criteria:
  - Selected fix addresses cause rather than symptom
  - Regression risks are enumerated
  gates: []
- name: fix
  description: Implement the diagnosed defect fix and the regression test without unrelated refactoring.
  skill: stages/fix.md
  produces:
  - implementation_report
  tools:
  - detect_stack
  - run_command
  - git_status
  - git_diff
  - write_text
  - read_text
  - search_text
  checkpoint: true
  approval: false
  review_focus:
  - The root cause is corrected
  - A failing-before/passing-after test exists
  - Change surface stays minimal
  success_criteria:
  - Original reproduction passes
  - Unrelated behavior is preserved
  gates:
  - tool: detect_stack
    required: true
- name: regression
  description: Prove the bug is fixed and adjacent behavior has not regressed.
  skill: stages/regression.md
  produces:
  - regression_report
  tools:
  - run_tests
  - run_lint
  - run_typecheck
  - run_build
  - git_diff
  checkpoint: true
  approval: false
  review_focus:
  - Original failing case is now a test
  - Adjacent risk areas are tested
  - Command evidence is captured
  success_criteria:
  - Regression suite passes
  - Confidence statement matches evidence
  gates:
  - tool: run_tests
    required: true
  - tool: run_lint
    required: false
  - tool: run_typecheck
    required: false
  - tool: run_build
    required: true
- name: security
  description: Threat-model the implemented system and run practical security checks.
  skill: stages/security.md
  produces:
  - security_report
  tools:
  - secret_scan
  - dependency_audit
  - generate_sbom
  - search_text
  checkpoint: true
  approval: false
  review_focus:
  - Trust boundaries and abuse cases are reviewed
  - Secrets and dependencies are checked
  - Residual risk is explicit
  success_criteria:
  - No likely committed credential remains
  - Critical findings are fixed or block release
  gates:
  - tool: secret_scan
    required: true
  - tool: dependency_audit
    required: false
  - tool: generate_sbom
    required: false
- name: release
  description: Produce a reproducible, release-ready build and complete release documentation.
  skill: stages/release.md
  produces:
  - release_report
  tools:
  - run_build
  - secret_scan
  - release_readiness
  - artifact_inventory
  - generate_sbom
  checkpoint: true
  approval: true
  review_focus:
  - Build is reproducible
  - Install and rollback steps are tested
  - Known issues are explicit
  success_criteria:
  - Required release checks pass
  - No deployment occurs without explicit approval
  gates:
  - tool: run_build
    required: true
  - tool: secret_scan
    required: true
  - tool: release_readiness
    required: true
  - tool: artifact_inventory
    required: false
- name: handoff
  description: Deliver source, quickstart, verification evidence, architecture pointers, and remaining work.
  skill: stages/handoff.md
  produces:
  - handoff_report
  tools:
  - release_readiness
  - archive_workspace
  - artifact_inventory
  checkpoint: true
  approval: false
  review_focus:
  - Quickstart is executable
  - Deliverables and open items are unambiguous
  - Verification evidence is easy to find
  success_criteria:
  - A new engineer can continue
  - A source archive is produced
  gates:
  - tool: release_readiness
    required: true
  - tool: archive_workspace
    required: true
  - tool: artifact_inventory
    required: false
