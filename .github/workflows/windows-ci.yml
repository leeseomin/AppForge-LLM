name: Windows CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-native:
    name: Windows Server 2025 native gates
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: powershell
    env:
      APPFORGE_NO_OPEN: "1"
      APPFORGE_NO_PAUSE: "1"
      PYTHONUTF8: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up pinned Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Run full Windows check gate
        run: .\build.ps1 --check

      - name: Re-run Python suite as an explicit CI contract
        run: .\.venv\Scripts\python.exe -m pytest -q

      - name: Re-run frontend tests, typecheck, and production build
        run: |
          npm --prefix frontend run test:i18n
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix frontend run typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix frontend run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Re-run llm_bridge typecheck and tests
        working-directory: llm_bridge
        run: |
          bun run typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify batch wrapper
        shell: cmd
        run: build.bat --help

      - name: Re-run native AppContainer and Job Object integration tests
        run: .\.venv\Scripts\python.exe -m pytest -q tests/test_windows_pipeline_e2e.py

      - name: Run bounded web health and UI smoke
        env:
          APPFORGE_SKIP_INSTALL: "1"
          APPFORGE_SKIP_FRONTEND_BUILD: "1"
        run: .\build.ps1 --smoke --no-open
