name: Windows 11 release smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: appforge-windows11-release-smoke
  cancel-in-progress: false

jobs:
  windows11-release-smoke:
    name: Real Windows 11 DPAPI, ACL, AppContainer, and web smoke
    runs-on: [self-hosted, Windows, X64, appforge-win11]
    timeout-minutes: 75
    defaults:
      run:
        shell: powershell
    env:
      APPFORGE_NO_OPEN: "1"
      APPFORGE_NO_PAUSE: "1"
      PYTHONUTF8: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Confirm the runner is Windows 11
        run: |
          $os = Get-CimInstance Win32_OperatingSystem
          Write-Host "$($os.Caption) build $($os.BuildNumber)"
          if ($os.Caption -notmatch "Windows 11" -or [int]$os.BuildNumber -lt 22000) {
            throw "The appforge-win11 release gate must run on Windows 11 build 22000 or newer."
          }

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up pinned Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Run full Windows check gate
        run: .\build.ps1 --check

      - name: Re-run real DPAPI CurrentUser and DACL regression tests
        working-directory: llm_bridge
        run: bun test test/config.test.ts

      - name: Re-run real AppContainer and Job Object integration tests
        run: .\.venv\Scripts\python.exe -m pytest -q tests/test_windows_pipeline_e2e.py

      - name: Verify the double-click batch entrypoint
        shell: cmd
        run: build.bat --help

      - name: Run bounded web health and UI smoke
        env:
          APPFORGE_SKIP_INSTALL: "1"
          APPFORGE_SKIP_FRONTEND_BUILD: "1"
        run: .\build.ps1 --smoke --no-open
